# يوقظ خدمة Render النائمة كل ساعة ويطلب جمع الوظائف الجديدة.
# الأسرار المطلوبة في المستودع: FORSA_URL (مثل https://forsa-xxxx.onrender.com) و CRON_TOKEN.
name: collect-jobs
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
permissions: {}
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # قبل ضبط السرّين تتخطى المهمة بهدوء بدل أن تفشل كل ساعة
    env:
      CONFIGURED: ${{ secrets.FORSA_URL != '' && secrets.CRON_TOKEN != '' }}
    steps:
      - name: Not configured yet
        if: env.CONFIGURED != 'true'
        run: echo "::notice::أضف FORSA_URL و CRON_TOKEN في أسرار المستودع لتفعيل الجمع"
      - name: Wake service
        if: env.CONFIGURED == 'true'
        env:
          FORSA_URL: ${{ secrets.FORSA_URL }}
        run: |
          for i in $(seq 1 12); do
            if curl -fsS --max-time 30 "$FORSA_URL/api/health"; then exit 0; fi
            sleep 10
          done
          echo "service did not wake up" >&2; exit 1
      - name: Trigger collection
        if: env.CONFIGURED == 'true'
        env:
          FORSA_URL: ${{ secrets.FORSA_URL }}
          CRON_TOKEN: ${{ secrets.CRON_TOKEN }}
        run: |
          curl -fsS --max-time 30 -X POST -H "Authorization: Bearer $CRON_TOKEN" "$FORSA_URL/api/cron/collect"
